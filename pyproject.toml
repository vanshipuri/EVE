[project]
name = "eve-healthcare-api"
version = "1.0.0"
description = "Diagnostic test bookings with simulated payments — EVE Healthcare SDE Intern assignment"
requires-python = ">=3.11"
# Pinned runtime/test dependencies live in requirements.txt (single source of truth).

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, BLE: blind-except, DTZ: datetime
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ"]
ignore = [
    # B008: Depends()/Query()/Header() in defaults is the documented FastAPI idiom.
    "B008",
]
